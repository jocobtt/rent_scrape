name: rent-pipe

on:
  workflow_dispatch:
  schedule:
    # run every month on the 1st
    - cron: '0 0 1 * *'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo content
        uses: actions/checkout@v4 # checkout the repository content

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # install the python version needed
        
      # add caching 
      - name: Cache pip dependencies
        uses: actions/cache@v2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('./analysis/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r ./analysis/requirements.txt

      - name: execute challenger py script
        run: python ./analysis/challenger_model.py

      - name: execute py script 
        run: python ./analysis/reg_model.py

      # add model validation step
        
      # deploy model - using bentoml - separate this into a different pipeline
      - name: execute bentoml script 
        run: python ./analysis/bentoml_serve.py

      # add notifications
      - name: Send a slack notification
        uses: xxxxxxxxxxxxxxxxxxxxxxxxxx@xx
        with:
          status: ${{ job.status }}
          text: "The model has been retrained and deployed successfully"
          author_name: "retrain_model_pipeline"
          author_icon: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
          footer: "retrain_model_pipeline"
          ts: ${{ github.run_id }}
          channel: "general"
          username: "retrain_model_pipeline"
          icon_emoji: ":robot:"
          color: good
        
