name: Build & Push Docker Image with Security Scanning

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  GCR_REGISTRY: gcr.io
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  IMAGE_NAME: tokyo-model-api

jobs:
  security-pre-build:
    name: Pre-build Security Checks
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Install dependencies
        run: |
          cd api && pip install -e .

      - name: Run Safety check
        run: |
          cd api
          pip freeze > requirements.txt
          safety check --file requirements.txt --short-report

      - name: Run Bandit security linter
        run: |
          bandit -r api/ --severity-level medium --confidence-level medium

  build-and-push-modelapi:
    name: Build & Push with Security Scan
    runs-on: ubuntu-latest
    needs: security-pre-build
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx 
        uses: docker/setup-buildx-action@v4
      
      - name: Cache Docker Layers 
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      
      - name: Login to Google Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCR_REGISTRY }}
          username: _json_key
          password: ${{ secrets.GCR_KEY }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.GCR_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.GCR_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  image-security-scan:
    name: Container Image Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push-modelapi
    
    steps:
      - uses: actions/checkout@v4

      - name: Login to Google Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCR_REGISTRY }}
          username: _json_key
          password: ${{ secrets.GCR_KEY }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.GCR_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy for detailed JSON report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.GCR_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'json'
          output: 'trivy-results.json'

      - name: Check for critical vulnerabilities
        run: |
          if [ -f "trivy-results.json" ]; then
            critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json 2>/dev/null || echo "0")
            high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json 2>/dev/null || echo "0")
            
            echo "🔍 Vulnerability Scan Results:"
            echo "- Critical: $critical"
            echo "- High: $high"
            
            # Add to job summary
            echo "## 🔒 Container Security Scan Results" >> $GITHUB_STEP_SUMMARY
            echo "- **Critical Vulnerabilities**: $critical" >> $GITHUB_STEP_SUMMARY
            echo "- **High Vulnerabilities**: $high" >> $GITHUB_STEP_SUMMARY
            echo "- **Image**: \`${{ env.GCR_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
            
            # Fail build if critical vulnerabilities found
            if [ "$critical" -gt 0 ]; then
              echo "❌ Build failed: Critical vulnerabilities detected!"
              echo "Please fix critical security issues before deployment."
              exit 1
            fi
            
            # Warning for high vulnerabilities
            if [ "$high" -gt 5 ]; then
              echo "⚠️ Warning: High number of high-severity vulnerabilities ($high)"
              echo "Consider updating base image and dependencies."
            fi
          fi

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-security-scan-${{ github.sha }}
          path: |
            trivy-results.sarif
            trivy-results.json
          retention-days: 30

  deployment-ready:
    name: Mark as Deployment Ready
    runs-on: ubuntu-latest
    needs: [build-and-push-modelapi, image-security-scan]
    if: success()
    
    steps:
      - name: Deployment readiness check
        run: |
          echo "## ✅ Deployment Ready" >> $GITHUB_STEP_SUMMARY
          echo "Image successfully built and passed security scans:" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.GCR_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Ready for deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Security**: Passed vulnerability scanning" >> $GITHUB_STEP_SUMMARY
