name: Security & Vulnerability Scanning

on:
  # Run on all PRs and pushes to main
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  
  # Run weekly on Sundays at 2 AM UTC
  schedule:
    - cron: '0 2 * * 0'
  
  # Allow manual trigger
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  # Python dependency vulnerability scanning
  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit semgrep
          cd api && pip install -e .

      - name: Run Safety (dependency vulnerability scan)
        run: |
          echo "🔍 Scanning Python dependencies for known vulnerabilities..."
          cd api
          pip freeze > requirements.txt
          safety check --file requirements.txt --json --output safety-report.json || true
          echo "✅ Safety scan completed"

      - name: Run Bandit (code security scan)
        run: |
          echo "🔍 Scanning Python code for security issues..."
          bandit -r api/ -f json -o bandit-report.json || true
          echo "✅ Bandit scan completed"

      - name: Run Semgrep (SAST scan)
        run: |
          echo "🔍 Running static analysis security testing..."
          semgrep --config=auto api/ --json --output=semgrep-api-report.json || true
          echo "✅ Semgrep scan completed"

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security-reports
          path: |
            api/safety-report.json
            bandit-report.json
            semgrep-api-report.json
          retention-days: 30

      - name: Process Security Results
        if: always()
        run: |
          echo "## 🔒 Python Security Scan Results" >> $GITHUB_STEP_SUMMARY

          if [ -f "api/safety-report.json" ]; then
            vulnerabilities=$(jq '.vulnerabilities | length' api/safety-report.json 2>/dev/null || echo "0")
            echo "- **Safety (Dependencies)**: $vulnerabilities vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f "bandit-report.json" ]; then
            issues=$(jq '.results | length' bandit-report.json 2>/dev/null || echo "0")
            echo "- **Bandit (Code Security)**: $issues potential issues found" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f "semgrep-api-report.json" ]; then
            findings=$(jq '.results | length' semgrep-api-report.json 2>/dev/null || echo "0")
            echo "- **Semgrep (SAST)**: $findings findings in API code" >> $GITHUB_STEP_SUMMARY
          fi

  # Docker image vulnerability scanning
  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          tags: tokyo-rent-api:scan
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tokyo-rent-api:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy for JSON report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tokyo-rent-api:scan'
          format: 'json'
          output: 'trivy-results.json'

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-security-reports
          path: |
            trivy-results.sarif
            trivy-results.json
          retention-days: 30

      - name: Process Docker Security Results
        if: always()
        run: |
          echo "## 🐳 Docker Security Scan Results" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "trivy-results.json" ]; then
            # Count vulnerabilities by severity
            critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json 2>/dev/null || echo "0")
            high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json 2>/dev/null || echo "0")
            medium=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivy-results.json 2>/dev/null || echo "0")
            
            echo "- **Critical Vulnerabilities**: $critical" >> $GITHUB_STEP_SUMMARY
            echo "- **High Vulnerabilities**: $high" >> $GITHUB_STEP_SUMMARY
            echo "- **Medium Vulnerabilities**: $medium" >> $GITHUB_STEP_SUMMARY
            
            # Fail if critical vulnerabilities found
            if [ "$critical" -gt 0 ]; then
              echo "❌ Critical vulnerabilities found in Docker image!"
              exit 1
            fi
          fi

  # GitHub CodeQL Analysis
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # Secrets scanning
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better secret detection

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: GitLeaks Action
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE}} # Only required for Organizations. Not required for individual developers.

  # OWASP Dependency Check
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'tokyo-rent-predictor'
          path: '.'
          format: 'ALL'
          args: >
            --enableRetired
            --enableExperimental
            --log /github/workspace/dependency-check.log

      - name: Upload OWASP results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-reports
          path: reports/
          retention-days: 30

      - name: Upload OWASP Dependency Check results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif

  # Security summary and notifications
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [python-security, docker-security, codeql-analysis, secrets-scan, owasp-dependency-check]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        
      - name: Generate Security Summary
        run: |
          echo "# 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Repository**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Job status summary
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- Python Security: ${{ needs.python-security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Security: ${{ needs.docker-security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- CodeQL Analysis: ${{ needs.codeql-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Secrets Scan: ${{ needs.secrets-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- OWASP Dependency Check: ${{ needs.owasp-dependency-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 📋 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review security reports in the GitHub Security tab" >> $GITHUB_STEP_SUMMARY
          echo "2. Download detailed reports from workflow artifacts" >> $GITHUB_STEP_SUMMARY
          echo "3. Address critical and high-severity vulnerabilities first" >> $GITHUB_STEP_SUMMARY
          echo "4. Update dependencies with security patches" >> $GITHUB_STEP_SUMMARY

      - name: Check for critical issues
        run: |
          critical_issues=false
          
          # Check each job result
          if [ "${{ needs.docker-security.result }}" == "failure" ]; then
            echo "❌ Critical security issues found in Docker scan!"
            critical_issues=true
          fi
          
          # Add more critical checks as needed
          
          if [ "$critical_issues" == "true" ]; then
            echo "🚨 Critical security vulnerabilities detected!"
            echo "Please review the security reports and fix critical issues before deployment."
            exit 1
          else
            echo "✅ No critical security issues detected."
          fi