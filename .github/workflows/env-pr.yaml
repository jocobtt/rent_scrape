name: Terraform Plan GitHub Action

on:
  # adding this to allow for manual triggering of the workflow
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    # only trigger when the changes are in the TF folder or the yaml specifically for the env directory or the api directory
    paths:
      - 'env/**'
      - 'api/**'
      - '.github/workflows/env-pr.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  KIND_CLUSTER_NAME: testing-cluster

jobs:
  test-api:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Kubernetes Kind
        uses: helm/kind-action@main
        with:
          name: ${{ env.KIND_CLUSTER_NAME }}
          wait: 300s

      - name: Load Docker image to Kind
        run: |
          kind load docker-image ${{ fromJSON(steps.meta.outputs.json).tags[0] }} --name ${{ env.KIND_CLUSTER_NAME }}


      - name: Kustomize Build 
        shell: bash
        run: |
          kubectl apply -k env/
          kubectl wait --for=condition=available --timeout=300s deployment/api-test

      
      - name: Test API endpoint
        shell: python
        working-directory: ./analysis
        run: |
          sleep 120
          python3 model_test.py
      
      - name: Cleanup
        if: always()
        run: |
          kind delete cluster --name ${{ env.KIND_CLUSTER_NAME }}
