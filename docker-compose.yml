
services:
  # MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.8.1
    container_name: tokyo-rent-mlflow
    ports:
      - "${MLFLOW_PORT:-5001}:5000"  # Changed to 5001 to avoid conflict with macOS AirPlay
    volumes:
      - mlflow-data:/mlflow
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow/mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rent-predictor-network

  # Tokyo Rent Predictor API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: tokyo-rent-api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Mount model files
      - ./api/models:/app/models
      # For live-reload development, uncomment the next line AND the anonymous
      # volume below it, or the container's `uv sync` will overwrite your host .venv:
      # - ./api:/app
      # - /app/.venv
      # Persist MLflow runs locally
      - mlflow-runs:/app/mlruns
      # Persist prediction logs
      - prediction-logs:/app/prediction_logs
      # Persist monitoring reports
      - monitoring-reports:/app/monitoring_reports
    environment:
      - PORT=8000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONUNBUFFERED=1
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    depends_on:
      mlflow:
        condition: service_healthy
    # Multi-stage health checks (startup -> liveness -> readiness)
    healthcheck:
      # Use readiness probe for comprehensive health check
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Increased to allow model loading
    deploy:
      resources:
        limits:
          cpus: '2.0'          # Max 2 CPU cores
          memory: 2G           # Max 2GB RAM (ML models need memory)
        reservations:
          cpus: '0.5'          # Reserve 0.5 CPU cores
          memory: 512M         # Reserve 512MB RAM
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    networks:
      - rent-predictor-network
    restart: unless-stopped

  # Optional: Nginx reverse proxy (uncomment to use)
  # nginx:
  #   image: nginx:alpine
  #   container_name: tokyo-rent-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - api
  #   networks:
  #     - rent-predictor-network
  #   restart: unless-stopped

volumes:
  mlflow-data:
    driver: local
  mlflow-runs:
    driver: local
  prediction-logs:
    driver: local
  monitoring-reports:
    driver: local

networks:
  rent-predictor-network:
    driver: bridge
